name: Local speech CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: local-speech/requirements*.txt
      - run: python -m pip install -r local-speech/requirements-dev.txt
      - run: python -m unittest discover -s local-speech -p "test_*.py"
