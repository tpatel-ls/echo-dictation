<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Echo overlay — port verification</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; background: #090b10; overflow: hidden; }
      .desktop { position: fixed; inset: 0; background:
        radial-gradient(110% 70% at 14% 10%, #1c2b54 0%, transparent 46%),
        radial-gradient(110% 80% at 86% 14%, #3a2356 0%, transparent 50%),
        radial-gradient(60% 50% at 50% 52%, rgba(120,140,200,0.18) 0%, transparent 60%), #090b10; }
      .mock { position: absolute; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); box-shadow: 0 20px 60px rgba(0,0,0,0.4); padding: 16px 18px; }
      .mock-a { left: 5%; top: 12%; width: 36%; height: 56%; }
      .mock-b { right: 5%; top: 16%; width: 38%; height: 64%; background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)); }
      .ln { height: 9px; border-radius: 5px; margin: 9px 0; background: linear-gradient(90deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04)); }
      .ln.s { width: 60%; } .ln.m { width: 82%; } .ln.l { width: 96%; }
      .ln.accent { background: linear-gradient(90deg, #828dff, rgba(130,141,255,0.1)); width: 44%; }
      .stage { position: fixed; inset: 0; zoom: 2.0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      .lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #99a0b3; font-weight: 500; }
      .state { display:flex; flex-direction:column; align-items:center; gap:11px; }

      /* ── copied verbatim from src/renderer/overlay/overlay.css ── */
      .ov-capsule { position: relative; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 21px; border-radius: 28px;
        background: linear-gradient(180deg, rgba(28,30,40,0.8), rgba(13,14,20,0.88));
        backdrop-filter: blur(28px) saturate(155%); -webkit-backdrop-filter: blur(28px) saturate(155%);
        box-shadow: 0 24px 50px -14px rgba(0,0,0,0.74), 0 6px 18px -6px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.07), inset 0 1.4px 0 rgba(255,255,255,0.2), inset 0 -1px 1px rgba(0,0,0,0.4); }
      .ov-capsule::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.09), transparent 40%); -webkit-mask: linear-gradient(#000, transparent 50%); mask: linear-gradient(#000, transparent 50%); }
      .ov-glow { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); z-index: -1; width: 70%; height: 36px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(130,141,255,0.5), transparent); filter: blur(16px); opacity: 0; }
      .ov-listening .ov-glow { opacity: 0.85; } .ov-transcribing .ov-glow { opacity: 0.5; }
      .ov-rec { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #ff5d70; box-shadow: 0 0 9px rgba(255,93,112,0.8); }
      .ov-time { font-size: 12px; color: #99a0b3; font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
      .ov-check { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: #4ee3a0;
        background: radial-gradient(circle at 50% 35%, rgba(78,227,160,0.3), rgba(62,207,142,0.12)); box-shadow: 0 0 0 1px rgba(62,207,142,0.22), 0 0 16px rgba(62,207,142,0.22); }
      .ov-text { font-size: 13px; color: rgba(241,243,250,0.9); }
    </style>
  </head>
  <body>
    <div class="desktop">
      <div class="mock mock-a"><div class="ln l"></div><div class="ln accent"></div><div class="ln m"></div><div class="ln s"></div><div class="ln l"></div></div>
      <div class="mock mock-b"><div class="ln m"></div><div class="ln l"></div><div class="ln s"></div></div>
    </div>
    <div class="stage">
      <div class="state"><span class="lbl">Listening</span>
        <div class="ov-capsule ov-listening"><span class="ov-glow"></span><span class="ov-rec"></span><canvas id="live" style="width:180px;height:30px;display:block"></canvas><span class="ov-time">0:04</span></div>
      </div>
      <div class="state"><span class="lbl">Transcribing</span>
        <div class="ov-capsule ov-transcribing"><span class="ov-glow"></span><canvas id="calm" style="width:196px;height:30px;display:block"></canvas></div>
      </div>
      <div class="state"><span class="lbl">Inserted</span>
        <div class="ov-capsule"><span class="ov-check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="ov-text">send him the report by Friday</span></div>
      </div>
    </div>
    <script>
      // exact draw logic from Waveform.tsx
      const N = 23, BAR_W = 3, GAP = 2.5
      function setup(id, w, h) {
        const c = document.getElementById(id); const dpr = Math.min(window.devicePixelRatio||1,2)
        c.width = w*dpr; c.height = h*dpr; const ctx = c.getContext('2d'); ctx.scale(dpr,dpr)
        return { ctx, w, h }
      }
      const live = setup('live',180,30), calm = setup('calm',196,30)
      let t = 0, sm = 0
      function rr(ctx,x,y,w,h,r){const rad=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath()}
      function drawOne(o, liveMode, levelTarget) {
        const { ctx, w, h } = o
        const target = liveMode ? Math.min(1, levelTarget*6) : 0
        sm += (target - sm) * 0.3
        ctx.clearRect(0,0,w,h)
        const g = ctx.createLinearGradient(0,0,0,h)
        if (liveMode){g.addColorStop(0,'#fdfdff');g.addColorStop(1,'#aeb6ee')} else {g.addColorStop(0,'#aab2e0');g.addColorStop(1,'#7882c8')}
        ctx.fillStyle=g; ctx.shadowColor='rgba(160,170,235,0.35)'; ctx.shadowBlur=liveMode?6:0
        const totalW=N*BAR_W+(N-1)*GAP, startX=(w-totalW)/2, mid=(N-1)/2
        for(let i=0;i<N;i++){
          const cw=1-Math.abs(i-mid)/mid; let amp
          if(liveMode){const sh=(Math.sin(t*6+i*0.7)*0.5+0.5)*0.35+0.65; const base=0.12+sm*0.95; amp=base*Math.pow(0.32+cw*0.68,1.3)*sh}
          else{amp=0.14+(Math.sin(t*2.4-i*0.45)*0.5+0.5)*0.22}
          const bh=Math.max(2.5,Math.min(1,amp)*h), x=startX+i*(BAR_W+GAP), y=(h-bh)/2
          rr(ctx,x,y,BAR_W,bh,BAR_W/2); ctx.fill()
        }
      }
      function frame(){ t+=0.05; const lvl=(Math.sin(t*1.6)*0.5+0.5)*0.2 + (Math.sin(t*4.2)*0.5+0.5)*0.06; drawOne(live,true,lvl); drawOne(calm,false,0); requestAnimationFrame(frame) }
      frame()
    </script>
  </body>
</html>
