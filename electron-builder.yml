appId: com.tanay.echo
productName: Echo
# uiohook-napi / nut.js ship prebuilt N-API binaries (ABI-stable) and sql.js is WASM,
# so nothing needs recompiling — skip the node-gyp rebuild (no Visual Studio required).
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/sql.js/**'
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm/sql-wasm.wasm
  - from: out/native
    to: native
  # Seeds API keys on first run so the packaged app works out of the box (personal
  # build). Remove this + secrets.local.json to require entering keys in Settings.
  - from: secrets.local.json
    to: secrets.local.json
win:
  # Skip signing + rcedit editing — both need the winCodeSign toolchain, whose macOS
  # symlinks can't unpack without symlink privilege on this machine. The exe keeps the
  # default Electron icon but is fully functional.
  signAndEditExecutable: false
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Echo
mac:
  category: public.app-category.productivity
  icon: build/icon-mac.png
  target:
    - dmg
    - zip
  # Personal local signing identity. This is intentionally not an Apple Developer ID,
  # but it gives macOS privacy/TCC a stable designated requirement so Accessibility
  # permissions survive rebuilds on this Mac.
  identity: Echo Local Code Signing
  hardenedRuntime: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu-bar app — no persistent Dock icon (matches the Windows tray model).
    LSUIElement: 1
    # Shown in the macOS microphone-permission prompt.
    NSMicrophoneUsageDescription: Echo transcribes your speech using the Whisper endpoint you configure.
    # Shown if Apple Speech is used as the optional native accuracy fallback.
    NSSpeechRecognitionUsageDescription: Echo uses Apple Speech only as a secondary accuracy check for existing dictation audio.
